                  "@type": "Answer",

              },
              {
                "@type": "Question",
                "name": "How long does it take to build a website?",
                "acceptedAnswer": {
                  "@type": "Answer",

                }
              },
              {
                "@type": "Question",
                "name": "Is SEO included?",

                  "text": "Yes. Basic SEO (page titles, meta descriptions, page speed, URL structure and a sitemap) is included in every project at no extra cost."
                }
              },
              {
                "@type": "Question",
                "name": "Do I own the code and accounts?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You receive the full source code, hosting and domain access, and documentation. You are free to work with anyone after launch."
